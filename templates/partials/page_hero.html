{% if page_title or page_subtitle %}
<section class="relative overflow-hidden border-b border-ink-200/60 bg-white">
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,rgba(20,184,166,0.12),transparent_55%),radial-gradient(ellipse_at_bottom_left,rgba(245,158,11,0.08),transparent_50%)]"></div>
  <div class="relative mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8 lg:py-20">
    <nav aria-label="Fil d'Ariane" class="flex items-center gap-1.5 text-xs font-medium text-ink-400">
      <a href="{% url 'home' %}" class="flex items-center gap-1 transition hover:text-brand-700">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Accueil
      </a>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3 w-3"><path d="m9 18 6-6-6-6"/></svg>
      <span class="text-ink-600">{{ page_title }}</span>
    </nav>
    <h1 class="mt-4 max-w-3xl font-display text-3xl font-extrabold tracking-tight text-ink-900 sm:text-4xl lg:text-[2.75rem] lg:leading-[1.1]">{{ page_title }}</h1>
    {% if page_subtitle %}<p class="mt-4 max-w-2xl text-lg leading-relaxed text-ink-500">{{ page_subtitle }}</p>{% endif %}
  </div>
</section>
{% endif %}
